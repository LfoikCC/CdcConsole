server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: cdc-platform
  datasource:
    url: jdbc:h2:file:${CDC_DATA_DIR:./data}/config/cdc;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
cdc:
  audit:
    retention-days: ${CDC_AUDIT_RETENTION_DAYS:180}
  time-zone: ${CDC_TIME_ZONE:Asia/Shanghai}
  cache:
    directory: ${CDC_DATA_DIR:./data}/cache
    segment-size-mb: ${CDC_SEGMENT_SIZE_MB:100}
    retention-days: ${CDC_RETENTION_DAYS:7}
  delivery:
    max-pending-bytes: ${CDC_DELIVERY_MAX_PENDING_BYTES:10737418240}
    max-attempts: ${CDC_DELIVERY_MAX_ATTEMPTS:6}
    stream-load-max-bytes: ${CDC_STREAM_LOAD_MAX_BYTES:10485760}
  poller:
    tick-ms: ${CDC_POLLER_TICK_MS:100}
  metrics:
    retention-days: ${CDC_METRICS_RETENTION_DAYS:7}
    sample-ms: ${CDC_METRICS_SAMPLE_MS:60000}
  profiles:
    light-snapshot-chunk-size: ${CDC_LIGHT_SNAPSHOT_CHUNK_SIZE:10000}
    heavy-snapshot-chunk-size: ${CDC_HEAVY_SNAPSHOT_CHUNK_SIZE:50000}
    steady-batch-size: ${CDC_STEADY_BATCH_SIZE:500}
    frequent-batch-size: ${CDC_FREQUENT_BATCH_SIZE:2000}
    steady-poll-interval-ms: ${CDC_STEADY_POLL_INTERVAL_MS:1000}
    frequent-poll-interval-ms: ${CDC_FREQUENT_POLL_INTERVAL_MS:200}
  debezium:
    directory: ${CDC_DATA_DIR:./data}/debezium
    offset-flush-interval-ms: ${CDC_DEBEZIUM_OFFSET_FLUSH_MS:1000}
  dev:
    max-rows-per-node: ${CDC_DEV_MAX_ROWS:2000000}
    batch-size: ${CDC_DEV_BATCH_SIZE:1000}
    preview-scan-rows: ${CDC_DEV_PREVIEW_SCAN_ROWS:5000}
    preview-rows: ${CDC_DEV_PREVIEW_ROWS:200}
    max-concurrent-runs: ${CDC_DEV_MAX_CONCURRENT_RUNS:2}
    temp-schema: ${CDC_DEV_TEMP_SCHEMA:DEV_TMP}
  dataset:
    directory: ${CDC_DATA_DIR:./data}/datasets
    storage-schema: ${CDC_DATASET_SCHEMA:DATASET_STORE}
    max-rows: ${CDC_DATASET_MAX_ROWS:100000}
    max-columns: ${CDC_DATASET_MAX_COLUMNS:200}
    max-sheets: ${CDC_DATASET_MAX_SHEETS:20}
logging:
  level:
    com.cdcplatform: INFO
